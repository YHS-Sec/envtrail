name: Bug report
description: Report a reproducible problem with capture, comparison, or output.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve EnvTrail. Use synthetic or redacted data.
        Never attach real .env files, credentials, private paths, or unreviewed snapshots.
        For vulnerabilities, follow [SECURITY.md](https://github.com/YHS-Sec/envtrail/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: EnvTrail version or commit
      placeholder: 'Output of --version, or a commit SHA'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
      placeholder: 'Windows 11, Node.js 22.x'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and the smallest synthetic project or snapshot that shows the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted output or a screenshot if helpful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the attached content and removed secrets and personal or private metadata.
          required: true
