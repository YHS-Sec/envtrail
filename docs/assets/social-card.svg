      <circle cx="28" cy="138" r="2" fill="#d75c55"/><text x="36" y="142" fill="#7c8390" font-size="9">1 blocking</text><circle cx="108" cy="138" r="2" fill="#d59a39"/><text x="116" y="142" fill="#7c8390" font-size="9">1 warning</text><circle cx="192" cy="138" r="2" fill="#8a94b3"/><text x="200" y="142" fill="#7c8390" font-size="9">0 notes</text><text x="472" y="142" fill="#a0a6b2" font-size="8">2 snapshots</text>
      <rect x="25" y="171" width="296" height="166" rx="7" fill="#fff" stroke="#e6e9f0"/>
      <text x="38" y="192" fill="#475066" font-size="10" font-weight="600">Runtime &amp; environment</text>
      <path d="M25 203H321M25 229H321M25 263H321M25 297H321" stroke="#edf0f5"/>
