<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">EnvTrail — Environment drift, made visible.</title>
  <desc id="desc">A light developer-tool banner with a cobalt EnvTrail mark and a compact report showing runtime differences and next steps.</desc>
  <rect width="1280" height="640" fill="#f6f7f9"/>
  <path d="M0 0H1280V8H0Z" fill="#4355d8"/>
  <g transform="translate(72 83)">
    <rect width="40" height="40" rx="11" fill="#4355d8"/>
    <g fill="#fff" transform="rotate(28 20 20)"><rect x="11" y="20" width="4" height="12" rx="2"/><rect x="19" y="12" width="4" height="20" rx="2"/><rect x="27" y="5" width="4" height="27" rx="2"/></g>
    <text x="54" y="29" fill="#202532" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="-1.2">EnvTrail</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="224" fill="#4355d8" font-size="11" font-weight="600" letter-spacing="1.7">DEVELOPER ENVIRONMENT DIAGNOSTICS</text>
    <text x="69" y="293" fill="#202532" font-size="54" font-weight="700" letter-spacing="-2.2">Environment drift,</text>
    <text x="69" y="356" fill="#202532" font-size="54" font-weight="700" letter-spacing="-2.2">made visible.</text>
    <text x="72" y="409" fill="#747b89" font-size="18">Local snapshots. Precise comparisons.</text>
    <text x="72" y="437" fill="#747b89" font-size="18">A useful next step for every finding.</text>
    <g font-family="Consolas, monospace" font-size="11">
      <rect x="72" y="483" width="124" height="31" rx="6" fill="#fff" stroke="#e0e4ed"/><text x="87" y="503" fill="#59637a">OFFLINE REPORTS</text>
      <rect x="206" y="483" width="112" height="31" rx="6" fill="#fff" stroke="#e0e4ed"/><text x="221" y="503" fill="#59637a">NO TELEMETRY</text>
    </g>
    <text x="72" y="584" fill="#959ca8" font-size="12">Open source · Node.js projects · Windows, macOS &amp; Linux</text>
  </g>
  <g transform="translate(652 143)">
    <rect x="4" y="9" width="556" height="365" rx="13" fill="#e8eaf0" opacity=".65"/>
    <rect width="556" height="365" rx="13" fill="#ffffff" stroke="#e1e5ed"/>
    <path d="M0 45H556" stroke="#e9ecf2"/>
    <g font-family="Arial, Helvetica, sans-serif">
