      <g font-size="9"><text x="38" y="250" fill="#697487">Node.js</text><text x="38" y="284" fill="#697487">npm</text><text x="38" y="318" fill="#697487">Required keys</text></g>
      <g font-family="Consolas, monospace" font-size="9"><text x="153" y="250" fill="#7e889b">22.20.0</text><text x="239" y="250" fill="#303848" font-weight="700">24.1.0</text><circle cx="289" cy="247" r="2" fill="#d29b4a"/><text x="153" y="284" fill="#7e889b">10.9.3</text><text x="239" y="284" fill="#7e889b">10.9.3</text><text x="153" y="318" fill="#7e889b">3 / 3</text><text x="239" y="318" fill="#303848" font-weight="700">2 / 3</text><circle cx="278" cy="315" r="2" fill="#d29b4a"/></g>
      <rect x="334" y="171" width="197" height="166" rx="7" fill="#fff" stroke="#e6e9f0"/>
      <circle cx="349" cy="189" r="2" fill="#c94d48"/><text x="357" y="192" fill="#475066" font-size="10" font-weight="600">Resolve first</text>
      <path d="M334 203H531" stroke="#edf0f5"/>
      <rect x="347" y="218" width="15" height="15" rx="4" fill="#f1f3f9" stroke="#e8eaf2"/><text x="352" y="228" fill="#838ca0" font-size="8">1</text>
      <text x="371" y="227" fill="#475066" font-size="9" font-weight="600">Required key is absent</text>
      <text x="371" y="246" fill="#88909f" font-size="8">Configure DATABASE_URL</text><text x="371" y="260" fill="#88909f" font-size="8">locally, then capture again.</text>
      <path d="M334 301H531" stroke="#edf0f5"/><text x="347" y="322" fill="#4355d8" font-size="9">View all findings ↗</text>
