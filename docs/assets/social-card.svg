      <circle cx="438" cy="23" r="2.5" fill="#54846a"/><text x="446" y="27" fill="#9098a7" font-size="8">Offline HTML report</text>
      <text x="25" y="83" fill="#252c3b" font-size="21" font-weight="600" letter-spacing="-.6">Environment comparison</text>
      <rect x="417" y="66" width="114" height="22" rx="5" fill="#fff0ef" stroke="#f3dedb"/><circle cx="428" cy="77" r="2" fill="#b63838"/><text x="435" y="80" fill="#b63838" font-size="8">Action required</text>
      <text x="25" y="106" fill="#8b929e" font-size="9">Review the current environment against your baseline.</text>
